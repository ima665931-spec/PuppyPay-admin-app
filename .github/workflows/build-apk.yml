name: Build Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean android tree and scaffold
        run: |
          mkdir -p /tmp/pp-fb
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/pp-fb/google-services.json
          fi
          rm -rf android
          flutter create . --project-name puppypay_admin --org com.puppypay --platforms=android
          mkdir -p android/app
          if [ -f /tmp/pp-fb/google-services.json ]; then
            cp /tmp/pp-fb/google-services.json android/app/google-services.json
          fi

      - name: Configure Firebase package + plugins
        run: |
          set -e
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = ".*"/applicationId = "com.puppypay.admin"/' android/app/build.gradle.kts
            if ! grep -q 'com.google.gms.google-services' android/app/build.gradle.kts; then
              sed -i '/plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
            fi
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId ".*"/applicationId "com.puppypay.admin"/' android/app/build.gradle || true
            sed -i 's/applicationId = ".*"/applicationId = "com.puppypay.admin"/' android/app/build.gradle || true
            if ! grep -q 'com.google.gms.google-services' android/app/build.gradle; then
              sed -i '/plugins {/a\    id "com.google.gms.google-services"' android/app/build.gradle
            fi
          fi
          if [ -f android/settings.gradle.kts ]; then
            if ! grep -q 'com.google.gms.google-services' android/settings.gradle.kts; then
              sed -i '/plugins {/a\    id("com.google.gms.google-services") version("4.4.2") apply false' android/settings.gradle.kts
            fi
          fi
          if [ -f android/settings.gradle ]; then
            if ! grep -q 'com.google.gms.google-services' android/settings.gradle; then
              sed -i '/plugins {/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
            fi
          fi
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'POST_NOTIFICATIONS' "$MANIFEST"; then
              sed -i '/<manifest /a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>' "$MANIFEST"
            fi
            if ! grep -q 'default_notification_channel_id' "$MANIFEST"; then
              sed -i '/<application/a\        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="order_alerts" />' "$MANIFEST"
            fi
          fi
          test -f android/app/google-services.json && echo "google-services.json OK"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PuppyPay-Admin-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
