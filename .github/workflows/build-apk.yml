name: Build Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate call-style alert ringtone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p assets/sounds
          ffmpeg -y -f lavfi -i "sine=frequency=1100:duration=0.2" \
            -f lavfi -i "sine=frequency=700:duration=0.2" \
            -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1,aloop=loop=9:size=8820" \
            -t 4 -ar 22050 -ac 1 -b:a 64k assets/sounds/alert_ring.mp3
          ls -la assets/sounds/alert_ring.mp3

      - name: Scaffold clean Android project
        run: |
          mkdir -p /tmp/pp-fb
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/pp-fb/google-services.json
          fi
          rm -rf android
          flutter create . --project-name puppypay_admin --org com.puppypay --platforms=android
          if [ -f /tmp/pp-fb/google-services.json ]; then
            cp /tmp/pp-fb/google-services.json android/app/google-services.json
          fi

      - name: Configure Android for Firebase + desugaring + permissions
        run: |
          set -e
          APP_GRADLE=android/app/build.gradle.kts
          SETTINGS=android/settings.gradle.kts
          MANIFEST=android/app/src/main/AndroidManifest.xml

          sed -i 's/applicationId = ".*"/applicationId = "com.puppypay.admin"/' "$APP_GRADLE"

          if ! grep -q 'com.google.gms.google-services' "$APP_GRADLE"; then
            sed -i '/^plugins {/a\    id("com.google.gms.google-services")' "$APP_GRADLE"
          fi
          if ! grep -q 'com.google.gms.google-services' "$SETTINGS"; then
            sed -i '/^plugins {/a\    id("com.google.gms.google-services") version("4.4.2") apply false' "$SETTINGS"
          fi
          if ! grep -q 'isCoreLibraryDesugaringEnabled' "$APP_GRADLE"; then
            sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$APP_GRADLE"
          fi
          if ! grep -q 'desugar_jdk_libs' "$APP_GRADLE"; then
            if grep -q '^dependencies {' "$APP_GRADLE"; then
              sed -i '/^dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' "$APP_GRADLE"
            else
              printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$APP_GRADLE"
            fi
          fi

          # Permissions for alarm-style alerts
          if ! grep -q 'android.permission.VIBRATE' "$MANIFEST"; then
            sed -i 's|<manifest |<manifest |' "$MANIFEST"
            # Insert permissions right after <manifest ...>
            python3 - <<'PY'
from pathlib import Path
p = Path("android/app/src/main/AndroidManifest.xml")
t = p.read_text()
perms = '''
    <uses-permission android:name="android.permission.VIBRATE"/>
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
    <uses-permission android:name="android.permission.WAKE_LOCK"/>
    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
'''
if "android.permission.VIBRATE" not in t:
    t = t.replace("<application", perms + "    <application", 1)
    p.write_text(t)
print("manifest ok")
PY
          fi

          ls -la android/app/google-services.json
          head -40 "$MANIFEST"

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PuppyPay-Admin-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
