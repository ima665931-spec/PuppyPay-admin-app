name: Build Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean android tree and scaffold
        run: |
          mkdir -p /tmp/pp-fb
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/pp-fb/google-services.json
          fi
          rm -rf android
          flutter create . --project-name puppypay_admin --org com.puppypay --platforms=android
          mkdir -p android/app
          if [ -f /tmp/pp-fb/google-services.json ]; then
            cp /tmp/pp-fb/google-services.json android/app/google-services.json
          fi

      - name: Configure Firebase package + plugins
        run: |
          set -e
          # applicationId + google-services plugin
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = ".*"/applicationId = "com.puppypay.admin"/' android/app/build.gradle.kts
            if ! grep -q 'com.google.gms.google-services' android/app/build.gradle.kts; then
              sed -i '/^plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
            fi
          fi
          if [ -f android/settings.gradle.kts ]; then
            if ! grep -q 'com.google.gms.google-services' android/settings.gradle.kts; then
              sed -i '/^plugins {/a\    id("com.google.gms.google-services") version("4.4.2") apply false' android/settings.gradle.kts
            fi
          fi

          # Safe AndroidManifest patch via Python (no broken XML)
          python3 << 'PY'
from pathlib import Path
p = Path("android/app/src/main/AndroidManifest.xml")
t = p.read_text()
if "POST_NOTIFICATIONS" not in t:
    t = t.replace(
        "<manifest",
        """<manifest",
        1,
    )
    # inject permissions right after opening <manifest ...>
    import re
    t = re.sub(
        r"(<manifest[^>]*>)",
        r"""\1
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
    <uses-permission android:name="android.permission.VIBRATE"/>
    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>""",
        t,
        count=1,
    )
if "default_notification_channel_id" not in t:
    import re
    t = re.sub(
        r"(<application[^>]*>)",
        r"""\1
        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="order_alerts" />""",
        t,
        count=1,
    )
p.write_text(t)
print("Manifest OK")
print(p.read_text()[:500])
PY
          test -f android/app/google-services.json && echo "google-services.json OK"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PuppyPay-Admin-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
