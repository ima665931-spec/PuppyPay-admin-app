name: Build Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold clean Android project
        run: |
          mkdir -p /tmp/pp-fb
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/pp-fb/google-services.json
          fi
          rm -rf android
          flutter create . --project-name puppypay_admin --org com.puppypay --platforms=android
          if [ -f /tmp/pp-fb/google-services.json ]; then
            cp /tmp/pp-fb/google-services.json android/app/google-services.json
          fi

      - name: Set applicationId and Google Services plugin
        run: |
          # Force package name for Firebase
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = ".*"/applicationId = "com.puppypay.admin"/' android/app/build.gradle.kts
            grep -q google-services android/app/build.gradle.kts || sed -i '/^plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          fi
          if [ -f android/settings.gradle.kts ]; then
            grep -q google-services android/settings.gradle.kts || sed -i '/^plugins {/a\    id("com.google.gms.google-services") version("4.4.2") apply false' android/settings.gradle.kts
          fi
          ls -la android/app/google-services.json

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PuppyPay-Admin-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
